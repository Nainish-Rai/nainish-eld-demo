services:
  postgres:
    image: postgres:17
    container_name: spotter-ai-postgres
    environment:
      POSTGRES_DB: spotter_ai
      POSTGRES_USER: spotter
      POSTGRES_PASSWORD: spotter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotter -d spotter_ai"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
